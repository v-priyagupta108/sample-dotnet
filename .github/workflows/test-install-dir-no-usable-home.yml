name: "Install-dir fallback: no usable home and unwritable default"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  no-usable-home:
    name: Root HOME (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0-noble
      options: --user 1001:1001
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline-v6, pr-fallback-branch]
    env:
      HOME: '/'
      DOTNET_INSTALL_DIR: ''
      DOTNET_VERSION: '9.0.100'
    steps:
      - uses: actions/checkout@v7

      - name: Show runner environment
        shell: bash
        run: |
          id
          echo "HOME=$HOME"
          ls -ld /usr/share/dotnet

      - name: Setup .NET (v6, expect permission failure)
        if: matrix.variant == 'baseline-v6'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup .NET (PR, inspect missing-home warning)
        if: matrix.variant == 'pr-fallback-branch'
        uses: v-priyagupta108/setup-dotnet@install-dir-writable-fallback
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
