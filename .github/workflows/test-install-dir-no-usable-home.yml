name: "Install-dir fallback: no usable home and unwritable default"

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  no-usable-home:
    name: Empty HOME (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0-noble
      options: --user 1001:1001
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline-v6, pr-fallback-branch]
    env:
      HOME: ''
      DOTNET_INSTALL_DIR: ''
      DOTNET_VERSION: '9.0.100'
    steps:
      - uses: actions/checkout@v7

      - name: Verify unavailable home and fresh-install preconditions
        shell: bash
        run: |
          test "$(id -u)" -ne 0
          test -z "$HOME"
          test -z "$DOTNET_INSTALL_DIR"
          test -d /usr/share/dotnet
          test ! -w /usr/share/dotnet
          if [ -e "/usr/share/dotnet/sdk/$DOTNET_VERSION" ]; then
            echo "::error::Requested SDK already exists; this test requires a fresh installation"
            exit 1
          fi
          id
          ls -ld /usr/share/dotnet
          echo "HOME is explicitly empty, exercising the PR's no-usable-home branch"

      - name: Setup .NET (v6, expect permission failure)
        if: matrix.variant == 'baseline-v6'
        id: setup-v6
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup .NET (PR, inspect missing-home warning)
        if: matrix.variant == 'pr-fallback-branch'
        id: setup-pr
        uses: v-priyagupta108/setup-dotnet@install-dir-writable-fallback
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Report installation outcome and warning review criteria
        if: always()
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          V6_OUTCOME: ${{ steps.setup-v6.outcome }}
          PR_OUTCOME: ${{ steps.setup-pr.outcome }}
        run: |
          outcome="$V6_OUTCOME"
          if [ "$VARIANT" = pr-fallback-branch ]; then
            outcome="$PR_OUTCOME"
          fi
          echo "Setup outcome: $outcome"
          if [ "$outcome" != failure ]; then
            echo "::error::Expected installation failure at the unwritable default directory"
            exit 1
          fi
          {
            echo "### No usable home: $VARIANT"
            echo 'Installation failed as expected because no writable destination is available.'
            echo 'Review the setup step annotations for a directory-resolution warning explaining the unavailable home and unwritable default.'
            echo 'A runtime-installation failure warning alone does not satisfy that diagnostic requirement.'
            echo 'This workflow checks the installation outcome; warning presence must be reviewed in the setup annotations.'
          } >> "$GITHUB_STEP_SUMMARY"