
# .github/workflows/install-timing.yml (temporary branch only)
name: install-timing
on: workflow_dispatch
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        version: ['8.0', '11.0']        # 8.0 = zip path, 11.0 = tar.gz path
        drive: ['C:\dotnet', 'D:\dotnet']
    runs-on: ${{ matrix.os }}
    steps:
      - shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -Channel ${{ matrix.version }} -Quality preview `
            -InstallDir "${{ matrix.drive }}" -SkipNonVersionedFiles -NoPath -Verbose
  ubuntu-baseline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['8.0', '11.0']
    steps:
      - run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --channel ${{ matrix.version }} --quality preview \
            --install-dir "$HOME/dotnet" --skip-non-versioned-files --no-path --verbose
            
