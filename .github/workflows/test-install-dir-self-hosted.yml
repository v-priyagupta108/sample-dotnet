name: "Install-dir fallback: Linux self-hosted runner"

on:
  workflow_dispatch:
    inputs:
      dotnet-version:
        description: '.NET version to install'
        required: false
        default: '8.0.x'
  push:

permissions:
  contents: read

env:
  DOTNET_VERSION: ${{ inputs.dotnet-version || '8.0.x' }}

jobs:
  baseline-v6:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Verify Linux runner prerequisites
        shell: bash
        run: |
          test "$(uname -s)" = Linux
          test "$(id -u)" -ne 0
          test -z "${DOTNET_INSTALL_DIR:-}"
          test -d /usr/share/dotnet
          test -r /usr/share/dotnet
          test -x /usr/share/dotnet
          test ! -w /usr/share/dotnet
          if test -e /usr/share/dotnet/sdk; then
            echo "::error::Use a clean VM without a system SDK directory"
            exit 1
          fi
          test -n "$HOME"
          mkdir -p "$HOME/.dotnet"
          probe=$(mktemp -d "$HOME/.dotnet/.runner-probe-XXXXXX")
          rmdir "$probe"

      - name: Setup .NET (v6, expect permission failure)
        id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify baseline outcome
        if: always() && steps.setup-dotnet.outcome != 'skipped'
        shell: bash
        run: |
          echo "setup-dotnet outcome: ${{ steps.setup-dotnet.outcome }}"
          test '${{ steps.setup-dotnet.outcome }}' = failure

  pr-fallback-branch:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Verify Linux runner prerequisites
        shell: bash
        run: |
          test "$(uname -s)" = Linux
          test "$(id -u)" -ne 0
          test -z "${DOTNET_INSTALL_DIR:-}"
          test -d /usr/share/dotnet
          test -r /usr/share/dotnet
          test -x /usr/share/dotnet
          test ! -w /usr/share/dotnet
          if test -e /usr/share/dotnet/sdk; then
            echo "::error::Use a clean VM without a system SDK directory"
            exit 1
          fi
          test -n "$HOME"
          mkdir -p "$HOME/.dotnet"
          probe=$(mktemp -d "$HOME/.dotnet/.runner-probe-XXXXXX")
          rmdir "$probe"

      - name: Setup .NET (PR, expect home fallback)
        uses: v-priyagupta108/setup-dotnet@install-dir-writable-fallback
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify fallback was used
        shell: bash
        run: |
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          test "$DOTNET_ROOT" = "$HOME/.dotnet"
          test "$(command -v dotnet)" = "$HOME/.dotnet/dotnet"
          dotnet --info
          dotnet --list-sdks