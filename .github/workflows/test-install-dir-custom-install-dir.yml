name: "Install-dir fallback 03: DOTNET_INSTALL_DIR explicitly set"

# Issue #518 / PR #5: when DOTNET_INSTALL_DIR is set, it must always be used
# as-is, with no writability probing. This already works on v6 (existing
# behavior); the PR branch must preserve it while the default dir is unwritable.

on:
  workflow_dispatch:
    inputs:
      dotnet-version:
        description: '.NET version to install'
        required: false
        default: '8.0.x'
  push:

env:
  DOTNET_VERSION: ${{ inputs.dotnet-version || '8.0.x' }}

jobs:
  baseline-v6-linux:
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: /tmp/custom-dotnet-install
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET (actions/setup-dotnet@v6, no PR change)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify custom install dir was used
        run: |
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          if [ "$DOTNET_ROOT" != "/tmp/custom-dotnet-install" ]; then
            echo "::error::expected /tmp/custom-dotnet-install but got '$DOTNET_ROOT'"
            exit 1
          fi
          dotnet --info

  baseline-v6-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set DOTNET_INSTALL_DIR to a writable custom path
        shell: pwsh
        run: echo "DOTNET_INSTALL_DIR=$(Join-Path $env:RUNNER_TEMP 'custom-dotnet-install')" >> $env:GITHUB_ENV

      - name: Setup .NET (actions/setup-dotnet@v6, no PR change)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify custom install dir was used
        shell: pwsh
        run: |
          Write-Host "DOTNET_ROOT=$env:DOTNET_ROOT"
          $expected = Join-Path $env:RUNNER_TEMP "custom-dotnet-install"
          if ($env:DOTNET_ROOT -ne $expected) {
            Write-Error "expected $expected but got '$env:DOTNET_ROOT'"
            exit 1
          }
          dotnet --info

  baseline-v6-macos:
    runs-on: macos-latest
    env:
      DOTNET_INSTALL_DIR: /tmp/custom-dotnet-install
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET (actions/setup-dotnet@v6, no PR change)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify custom install dir was used
        run: |
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          if [ "$DOTNET_ROOT" != "/tmp/custom-dotnet-install" ]; then
            echo "::error::expected /tmp/custom-dotnet-install but got '$DOTNET_ROOT'"
            exit 1
          fi
          dotnet --info

  pr-fallback-branch-macos:
    runs-on: macos-latest
    env:
      DOTNET_INSTALL_DIR: /tmp/custom-dotnet-install
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET (expect DOTNET_INSTALL_DIR honored, no probing)
        uses: v-priyagupta108/setup-dotnet@install-dir-writable-fallback
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify custom install dir was used
        run: |
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          if [ "$DOTNET_ROOT" != "/tmp/custom-dotnet-install" ]; then
            echo "::error::expected /tmp/custom-dotnet-install but got '$DOTNET_ROOT'"
            exit 1
          fi
          dotnet --info

  pr-fallback-branch-linux:
    runs-on: ubuntu-latest
    env:
      DOTNET_INSTALL_DIR: /tmp/custom-dotnet-install
    steps:
      - uses: actions/checkout@v7

      - name: Make /usr/share/dotnet unwritable
        run: |
          sudo mkdir -p /usr/share/dotnet
          sudo chown root:root /usr/share/dotnet
          sudo chmod 555 /usr/share/dotnet

      - name: Setup .NET (expect DOTNET_INSTALL_DIR honored, no probing)
        uses: v-priyagupta108/setup-dotnet@install-dir-writable-fallback
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify custom install dir was used
        run: |
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          if [ "$DOTNET_ROOT" != "/tmp/custom-dotnet-install" ]; then
            echo "::error::expected /tmp/custom-dotnet-install but got '$DOTNET_ROOT'"
            exit 1
          fi
          dotnet --info

  pr-fallback-branch-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set DOTNET_INSTALL_DIR to a writable custom path
        shell: pwsh
        run: echo "DOTNET_INSTALL_DIR=$(Join-Path $env:RUNNER_TEMP 'custom-dotnet-install')" >> $env:GITHUB_ENV

      - name: Deny write access to C:\Program Files\dotnet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Program Files\dotnet" | Out-Null
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls "C:\Program Files\dotnet" /deny "*${sid}:(OI)(CI)W"
          if ($LASTEXITCODE -ne 0) { throw "Failed to deny write access" }
          $probe = Join-Path "C:\Program Files\dotnet" ([guid]::NewGuid().ToString())
          $denied = $false
          try {
            [System.IO.Directory]::CreateDirectory($probe) | Out-Null
          } catch [System.UnauthorizedAccessException] {
            $denied = $true
          }
          if (-not $denied) {
            Remove-Item -LiteralPath $probe -Force
            throw "Default directory is still writable"
          }

      - name: Setup .NET (expect DOTNET_INSTALL_DIR honored, no probing)
        id: setup-dotnet
        uses: v-priyagupta108/setup-dotnet@install-dir-writable-fallback
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify custom install dir was used
        shell: pwsh
        run: |
          Write-Host "DOTNET_ROOT=$env:DOTNET_ROOT"
          Write-Host "setup-dotnet outcome: ${{ steps.setup-dotnet.outcome }}"
          $expected = Join-Path $env:RUNNER_TEMP "custom-dotnet-install"
          if ($env:DOTNET_ROOT -ne $expected) {
            Write-Error "expected $expected but got '$env:DOTNET_ROOT'"
            exit 1
          }
          dotnet --info

      - name: Restore permissions on C:\Program Files\dotnet
        if: always()
        shell: pwsh
        run: |
          $sid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls "C:\Program Files\dotnet" /remove:d "*$sid"
          if ($LASTEXITCODE -ne 0) { throw "Failed to restore write access" }
